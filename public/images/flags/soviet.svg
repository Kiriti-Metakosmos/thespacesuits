<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <rect width="30" height="20" fill="#CC0000"/>
  <!-- Star (5-pointed polygon) top-right -->
  <polygon points="24,1.5 25,4.2 27.8,4.2 25.6,5.9 26.4,8.5 24,6.9 21.6,8.5 22.4,5.9 20.2,4.2 23,4.2"
           fill="#FFD700"/>
  <!-- Hammer (two rectangles, simplified) -->
  <rect x="4.5" y="11.5" width="1.5" height="5.5" rx="0.4" fill="#FFD700"
        transform="rotate(-45 5.25 14.25)"/>
  <rect x="3" y="12.5" width="5" height="2" rx="0.5" fill="#FFD700"
        transform="rotate(-45 5.5 13.5)"/>
  <!-- Sickle (arc path) -->
  <path d="M10 8 A4.5 4.5 0 1 0 6.5 14.5" fill="none" stroke="#FFD700" stroke-width="1.6"
        stroke-linecap="round"/>
  <line x1="6.5" y1="14.5" x2="5" y2="16.5" stroke="#FFD700" stroke-width="1.4"
        stroke-linecap="round"/>
</svg>
