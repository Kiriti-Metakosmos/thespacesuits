name: Deploy The Spacesuits to Azure

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  NODE_VERSION: '20.x'

jobs:
  # ── Build & Test ─────────────────────────────────────────────
  build_and_test:
    runs-on: ubuntu-latest
    name: Build & Test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check (if configured)
        run: npm run lint --if-present

      - name: Run tests (if configured)
        run: npm test --if-present

      - name: Verify server starts
        run: |
          timeout 10 node server.js &
          sleep 4
          curl -f http://localhost:3000/ || exit 1
          curl -f http://localhost:3000/database || exit 1
          curl -f http://localhost:3000/sitemap.xml || exit 1
          echo "Server health checks passed"

  # ── Deploy to Azure Static Web Apps ────────────────────────
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure
    needs: build_and_test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://thespacesuits.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --only=production

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: ''
          app_build_command: 'npm run build --if-present'

      - name: Deployment summary
        run: |
          echo "✅ Deployed to https://thespacesuits.com"
          echo "🚀 Commit: ${{ github.sha }}"
          echo "👤 By: ${{ github.actor }}"

  # ── PR Preview Deploy ────────────────────────────────────────
  deploy_preview:
    runs-on: ubuntu-latest
    name: Deploy PR Preview
    needs: build_and_test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --only=production

      - name: Deploy PR Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          api_location: ''
          output_location: ''

  # ── Close PR — Remove Preview ────────────────────────────────
  close_pull_request:
    runs-on: ubuntu-latest
    name: Remove PR Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Close staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'close'
